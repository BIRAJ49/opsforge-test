name: OpsForge CI/CD
on:
  push:
    branches: [main]
jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Backend tests
        run: echo "run backend tests here"
      - name: Frontend build
        run: echo "run frontend build here"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push image
        run: |
          docker build -t ghcr.io/BIRAJ49/test:latest .
          docker push ghcr.io/BIRAJ49/test:latest
      - name: Update GitOps repo
        env:
          GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        run: echo "update opsforge-gitops image tag"
