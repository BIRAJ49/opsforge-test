apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-postgres
  namespace: opsforge
spec:
  serviceName: test-postgres
  replicas: 1
  selector:
    matchLabels:
      app: test-postgres
  template:
    metadata:
      labels:
        app: test-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-secret
                  key: POSTGRES_PASSWORD
