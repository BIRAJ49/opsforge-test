apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BIRAJ49/opsforge-gitops.git
    targetRevision: main
    path: apps/test/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: opsforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
